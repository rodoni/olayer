name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  documentation:
    name: Documentation links and navigation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local documentation
        run: python3 tools/check-docs.py

  rust:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --workspace --exclude olayer-desktop-demo

      - name: Verify Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --exclude olayer-desktop-demo --all-targets

      - name: Install software Vulkan renderer
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Verify WMS pixels in all view modes
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo test -p olayer-native wms_image_renders_into_offscreen_pixels_in_all_modes -- --ignored --nocapture

      - name: Verify WFS pixels in all view modes
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo test -p olayer-native wfs_features_render_into_offscreen_pixels_in_all_modes -- --ignored --nocapture

      - name: Verify shared terrain imagery and feature depth
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo test -p olayer-native terrain_and_imagery_occlude_wfs_in_shared_depth -- --ignored --nocapture

      - name: Verify WFS polygon fills and holes
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo test -p olayer-native wfs_polygon_fills_preserve_holes_in_offscreen_pixels -- --ignored --nocapture

      - name: Verify styled WFS immutable draw snapshots
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo test -p olayer-native immutable_styled_draw_has_two_colors_in_one_submission_all_modes -- --ignored --nocapture

      - name: Verify volumetric depth participation and transparency
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: cargo test -p olayer-native translucent_volumetric_mesh_tests_depth_without_writing_it -- --ignored --nocapture

      - name: Verify generated C header
        run: |
          cargo build -p olayer-native
          git diff --exit-code -- sdk/native/libolayer_native.h

      - name: Compile and run external C Map Core consumer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sdk/native sdk/native/tests/map_api_consumer.c \
            -L target/debug -lolayer_native -Wl,-rpath,"$PWD/target/debug" \
            -o target/map-api-consumer
          target/map-api-consumer

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM package
        working-directory: sdk/ts/wasm
        run: wasm-pack build --target web

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run headless WASM tests
        working-directory: sdk/ts/wasm
        run: wasm-pack test --headless --chrome

  typescript:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM package
        working-directory: sdk/ts/wasm
        run: wasm-pack build --target web

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/ts
        run: npm install

      - name: Run TypeScript tests
        working-directory: sdk/ts
        run: npm run test:run

      - name: Verify TypeScript contracts
        working-directory: sdk/ts
        run: npm run typecheck

      - name: Verify SDK build declarations and isolated package consumers
        working-directory: sdk/ts
        run: npm run test:package

      - name: Verify browser WMS rendering with WCS terrain
        working-directory: sdk/ts
        run: npm run test:wms:browser

      - name: Verify browser WFS rendering with WCS terrain
        working-directory: sdk/ts
        run: npm run test:wfs:browser

      - name: Verify browser terrain imagery and feature depth
        working-directory: sdk/ts
        run: npm run test:depth:browser

      - name: Verify browser volumetric depth and alpha blending
        working-directory: sdk/ts
        run: npm run test:volumetric:browser

      - name: Verify browser WFS polygon fills and holes
        working-directory: sdk/ts
        run: npm run test:wfs-fill:browser

  symbol-compiler:
    name: Symbol Compiler Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install symbol compiler dependencies
        working-directory: tools/symbol-compiler
        run: npm ci

      - name: Build and test symbol compiler
        working-directory: tools/symbol-compiler
        run: npm test
