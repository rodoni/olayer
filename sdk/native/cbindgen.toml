# cbindgen configuration for Olayer Native C-FFI

language = "C"
include_guard = "OLAYER_NATIVE_H"
autogen_warning = "/* Automatically generated by cbindgen. Do not modify manually. */"
no_includes = false
style = "tag"

after_includes = "typedef struct TerrainEngine TerrainEngine;\ntypedef struct InterpolationEngine InterpolationEngine;\ntypedef struct LocalTangentFrame LocalTangentFrame;\ntypedef struct MagneticModel MagneticModel;\ntypedef struct AeronauticalDataset AeronauticalDataset;\ntypedef struct SigmetDataset SigmetDataset;"

[export]
include = []
exclude = ["SigmetDataset"]
