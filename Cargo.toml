[workspace]
resolver = "2"
members = [
    "core",
    "map-core",
    "sdk/ts/wasm",
    "sdk/native",
    "sdk/native/demo",
]

[workspace.dependencies]
ahash = "0.8"
getrandom = { version = "0.3", features = ["wasm_js"] }
olayer-map-core = { path = "map-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
